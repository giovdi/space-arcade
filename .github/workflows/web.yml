name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica Godot e i modelli di esportazione
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -L -o godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -L -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot

      - name: Esporta Web
        run: |
          mkdir -p build/web
          ./godot --headless --import || true
          ./godot --headless --export-release Web build/web/index.html

      - name: Versione anti-cache (hash del commit)
        run: |
          V="${GITHUB_SHA::8}"
          cd build/web
          echo "{\"v\":\"$V\"}" > version.json
          cp "$GITHUB_WORKSPACE/web/versioncheck.js" versioncheck.js
          # ?v=<hash> su js, json e png referenziati dalla pagina
          sed -i -E "s#(index(\.[a-z-]+)*\.(js|json|png))#\1?v=$V#g" index.html
          # controllo versione caricato per primo + niente cache per la pagina
          sed -i "s#<head>#<head><meta http-equiv=\"Cache-Control\" content=\"no-cache\"><script src=\"versioncheck.js?v=$V\"></script>#" index.html
          grep -c "v=$V" index.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
